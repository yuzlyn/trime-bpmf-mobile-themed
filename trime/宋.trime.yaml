preset_keyboards:
  __include: danjing:/preset_keyboards

  bopomofo_tw:
    name: 注音鍵盤
    author: '单单 <cxprcn@gmail.com>, adapted for bopomofo_tw'
    ascii_mode: 0
    lock: true
    width: 10
    __patch: conf/main
    keys:
      # 第 1 行
      - { click: '1', label: 'ㄅ', long_click: bpmf_sym_1, width: 10, __include: styl/key }
      - { click: '2', label: 'ㄉ', long_click: bpmf_sym_2, width: 10, __include: styl/key }
      - { click: '3', label: 'ˇ', long_click: bpmf_sym_3, width: 10, __include: styl/key }
      - { click: '4', label: 'ˋ', long_click: bpmf_sym_4, width: 10, __include: styl/key }
      - { click: '5', label: 'ㄓ', long_click: bpmf_sym_5, width: 10, __include: styl/key }
      - { click: '6', label: 'ˊ', long_click: bpmf_sym_6, width: 10, __include: styl/key }
      - { click: '7', label: '˙', long_click: bpmf_sym_7, width: 10, __include: styl/key }
      - { click: '8', label: 'ㄚ', long_click: bpmf_sym_8, width: 10, __include: styl/key }
      - { click: '9', label: 'ㄞ', long_click: bpmf_sym_9, width: 10, __include: styl/key }
      - { click: '0', label: 'ㄢ', long_click: bpmf_sym_0, width: 10, __include: styl/key }
      # 第 2 行
      - { click: 'q', label: 'ㄆ', long_click: bpmf_sym_question, width: 10, __include: styl/key }
      - { click: 'w', label: 'ㄊ', long_click: bpmf_sym_exclaim, width: 10, __include: styl/key }
      - { click: 'e', label: 'ㄍ', long_click: bpmf_sym_enum, width: 10, __include: styl/key }
      - { click: 'r', label: 'ㄐ', long_click: bpmf_sym_colon, width: 10, __include: styl/key }
      - { click: 't', label: 'ㄔ', long_click: bpmf_sym_semicolon, width: 10, __include: styl/key }
      - { click: 'y', label: 'ㄗ', long_click: bpmf_sym_ellipsis, width: 10, __include: styl/key }
      - { click: 'u', label: 'ㄧ', long_click: bpmf_sym_dash, width: 10, __include: styl/key }
      - { click: 'i', label: 'ㄛ', long_click: bpmf_sym_middle_dot, width: 10, __include: styl/key }
      - { click: 'o', label: 'ㄟ', long_click: bpmf_sym_tilde, width: 10, __include: styl/key }
      - { click: 'p', label: 'ㄣ', long_click: bpmf_sym_yen, width: 10, __include: styl/key }
      # 第 3 行
      - { click: 'a', label: 'ㄇ', long_click: bpmf_sym_lparen, width: 10, __include: styl/key }
      - { click: 's', label: 'ㄋ', long_click: bpmf_sym_rparen, width: 10, __include: styl/key }
      - { click: 'd', label: 'ㄎ', long_click: bpmf_sym_lcorner, width: 10, __include: styl/key }
      - { click: 'f', label: 'ㄑ', long_click: bpmf_sym_rcorner, width: 10, __include: styl/key }
      - { click: 'g', label: 'ㄕ', long_click: bpmf_sym_ldbl, width: 10, __include: styl/key }
